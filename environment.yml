name: tender_ontology
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python 版本
  - python=3.11

  # PyTorch GPU (CUDA 12.4)
  - pytorch=2.6.0
  - torchvision=0.21.0
  - torchaudio=2.6.0
  - pytorch-cuda=12.4

  # 基础依赖 (conda-forge)
  - pip
  - numpy
  - pandas
  - pillow
  - requests=2.32.5
  - scipy
  - scikit-learn

  # pip 安装的依赖 (conda 没有的包)
  - pip:
    # Web 框架
    - fastapi>=0.121.3,<0.122.0
    - uvicorn[standard]>=0.38.0,<0.39.0
    - python-multipart>=0.0.20,<0.0.21
    - httpx>=0.28.1,<0.29.0

    # Pydantic
    - pydantic==2.12.4
    - pydantic-settings==2.11.0

    # 工具库
    - tenacity>=9.1.2,<10.0.0
    - tiktoken>=0.12.0,<0.13.0
    - python-dotenv>=1.2.1

    # 数据库
    - sqlalchemy>=2.0.44,<3.0.0
    - pymysql>=1.1.2,<2.0.0

    # Docling 文档处理
    - docling==2.61.1
    - pypdfium2==4.30.0
    - docling-hierarchical-pdf>=0.1.2,<0.2.0

    # AI/ML 相关
    - openai>=2.8.1
    - transformers>=4.57.1
    - accelerate>=1.12.0
    - huggingface-hub>=0.36.0
    - safetensors>=0.7.0

    # 文档处理
    - python-docx>=1.2.0
    - python-pptx>=1.0.2
    - openpyxl>=3.1.5
    - xlsxwriter>=3.2.9
    - PyMuPDF>=1.26.6
    - beautifulsoup4>=4.14.2
    - lxml>=6.0.2

    # OCR
    - rapidocr>=3.4.2
    - opencv-python>=4.12.0.88

    # 开发工具
    - black>=25.11.0,<26.0.0
    - ruff>=0.14.6,<0.15.0
    - pytest>=9.0.1,<10.0.0
    - pytest-asyncio>=1.3.0,<2.0.0