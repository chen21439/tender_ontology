[project]
name = "tender-ontology"
version = "0.1.0"
description = ""
authors = [
    {name = "chen21439",email = "14557167+chen21439@user.noreply.gitee.com"}
]
readme = "README.md"
requires-python = ">=3.11.2,<3.12"
dependencies = [
    "fastapi (>=0.121.3,<0.122.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "pydantic (==2.12.4)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.1,<0.29.0)",
    "requests (==2.32.5)",
    "tenacity (>=9.1.2,<10.0.0)",
    "pydantic-settings (==2.11.0)",
    "docling (==2.61.1)",
    "pypdfium2 (==4.30.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "docling-hierarchical-pdf (>=0.1.2,<0.2.0)"
]

[tool.poetry]
packages = [{include = "tender_ontology", from = "src"}]

[tool.poetry.scripts]
dev = "scripts:dev"
start = "scripts:start"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.11.0,<26.0.0)",
    "ruff (>=0.14.6,<0.15.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)"
]
